spring.application.name=scms-backend

server.port=8080

# DataSource - SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SportsCenterDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=true
spring.jackson.serialization.fail-on-empty-beans=false

# JWT
jwt.secret=${JWT_SECRET:scms-super-secret-key-minimum-32-bytes-hs256-ok}
jwt.expiration-ms=86400000

# CORS - Vite dev server
cors.allowed-origins=http://localhost:5173

# Logging
logging.level.com.scms=DEBUG
logging.level.org.springframework.security=INFO